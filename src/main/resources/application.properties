server.port=8093
spring.application.name=chatbot
server.address=0.0.0.0

#LOGGING
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}

#INTERNAL SECRET
app.internal.secret=${APP_INTERNAL_SECRET}

#GEMINI SERVICE
gemini.service.url=${GEMINI_SERVICE_URL}